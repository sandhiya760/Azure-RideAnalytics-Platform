
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.13'
    displayName: 'Set up Python'

  - script: |
      python -m pip install --upgrade pip
      python -m pip install -r requirements.txt
    displayName: 'Install Python dependencies'

  - script: |
      python -m pytest tests/ -v
    displayName: 'Run automated tests'

  - task: Docker@2
    displayName: 'Build and push API image'
    inputs:
      command: buildAndPush
      containerRegistry: dockerhub-connection
      repository: sandhiyadevops/rideanalytics-api
      Dockerfile: Dockerfile.api
      tags: |
        latest
        $(Build.BuildId)

  - task: Docker@2
    displayName: 'Build and push Producer image'
    inputs:
      command: buildAndPush
      containerRegistry: dockerhub-connection
      repository: sandhiyadevops/rideanalytics-producer
      Dockerfile: Dockerfile.producer
      tags: |
        latest
        $(Build.BuildId)

  - task: Docker@2
    displayName: 'Build and push Consumer image'
    inputs:
      command: buildAndPush
      containerRegistry: dockerhub-connection
      repository: sandhiyadevops/rideanalytics-consumer
      Dockerfile: Dockerfile.consumer
      tags: |
        latest
        $(Build.BuildId)

  - task: Docker@2
    displayName: 'Build and push Dashboard image'
    inputs:
      command: buildAndPush
      containerRegistry: dockerhub-connection
      repository: sandhiyadevops/rideanalytics-dashboard
      Dockerfile: Dockerfile.dashboard
      tags: |
        latest
        $(Build.BuildId)

  - task: AzureCLI@2
    displayName: 'Deploy RideAnalytics to AKS'
    inputs:
      azureSubscription: 'rideanalytics-azure-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az aks get-credentials \
          --resource-group rg-rideanalytics-dev \
          --name rideanalytics-aks \
          --admin \
          --overwrite-existing

        echo "Applying persistent storage..."
        kubectl apply -f k8s/storage.yaml

        echo "Applying application deployments..."
        kubectl apply -f k8s/apps.yaml

        echo "Waiting for deployments..."
        kubectl rollout status deployment/rideanalytics-producer \
          -n rideanalytics --timeout=300s

        kubectl rollout status deployment/rideanalytics-backend \
          -n rideanalytics --timeout=300s

        kubectl rollout status deployment/rideanalytics-dashboard \
          -n rideanalytics --timeout=300s

        echo "Checking Kubernetes resources..."
        kubectl get pods -n rideanalytics
        kubectl get services -n rideanalytics
