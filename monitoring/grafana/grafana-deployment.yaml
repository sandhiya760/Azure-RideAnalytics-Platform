apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: rideanalytics
data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.rideanalytics.svc.cluster.local:9090
        isDefault: true
        editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: rideanalytics
data:
  dashboard.yaml: |
    apiVersion: 1
    providers:
      - name: RideAnalytics
        orgId: 1
        folder: RideAnalytics
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/rideanalytics

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rideanalytics-dashboard
  namespace: rideanalytics
data:
  rideanalytics.json: |
    {
      "uid": "rideanalytics",
      "title": "RideAnalytics Platform",
      "tags": ["rideanalytics", "azure", "observability"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "title": "Total API Requests",
          "type": "stat",
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(rideanalytics_api_requests_total)", "refId": "A"}]
        },
        {
          "id": 2,
          "title": "API Request Rate",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 8, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(rate(rideanalytics_api_requests_total[5m]))", "legendFormat": "Requests/sec", "refId": "A"}]
        },
        {
          "id": 3,
          "title": "Average API Latency",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum(rate(rideanalytics_api_request_duration_seconds_sum[5m])) / sum(rate(rideanalytics_api_request_duration_seconds_count[5m]))", "legendFormat": "Seconds", "refId": "A"}]
        },
        {
          "id": 4,
          "title": "API Requests by HTTP Status",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (http_status) (rate(rideanalytics_api_requests_total[5m]))", "legendFormat": "{{http_status}}", "refId": "A"}]
        },
        {
          "id": 5,
          "title": "Python Process Memory",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "process_resident_memory_bytes", "legendFormat": "Memory", "refId": "A"}]
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: rideanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/rideanalytics
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: rideanalytics-dashboard

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: rideanalytics
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000

