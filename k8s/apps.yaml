apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideanalytics-producer
  namespace: rideanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rideanalytics-producer
  template:
    metadata:
      labels:
        app: rideanalytics-producer
    spec:
      containers:
        - name: producer
          image: sandhiyadevops/rideanalytics-producer:latest
          imagePullPolicy: Always
          env:
            - name: EVENT_HUB_PRODUCER_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: rideanalytics-eventhub-secret
                  key: EVENT_HUB_PRODUCER_CONNECTION_STRING
            - name: EVENT_HUB_NAME
              valueFrom:
                secretKeyRef:
                  name: rideanalytics-eventhub-secret
                  key: EVENT_HUB_NAME
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideanalytics-backend
  namespace: rideanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rideanalytics-backend
  template:
    metadata:
      labels:
        app: rideanalytics-backend
    spec:
      containers:
        - name: consumer
          image: sandhiyadevops/rideanalytics-consumer:latest
          imagePullPolicy: Always
          env:
            - name: EVENT_HUB_CONSUMER_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: rideanalytics-eventhub-secret
                  key: EVENT_HUB_CONSUMER_CONNECTION_STRING
            - name: EVENT_HUB_NAME
              valueFrom:
                secretKeyRef:
                  name: rideanalytics-eventhub-secret
                  key: EVENT_HUB_NAME
            - name: EVENT_HUB_CONSUMER_GROUP
              value: '$Default'
          volumeMounts:
            - name: ride-data
              mountPath: /app/data
        - name: api
          image: sandhiyadevops/rideanalytics-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: ride-data
              mountPath: /app/data
      volumes:
        - name: ride-data
          persistentVolumeClaim:
            claimName: ride-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: rideanalytics-api
  namespace: rideanalytics
spec:
  selector:
    app: rideanalytics-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rideanalytics-dashboard
  namespace: rideanalytics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rideanalytics-dashboard
  template:
    metadata:
      labels:
        app: rideanalytics-dashboard
    spec:
      containers:
        - name: dashboard
          image: sandhiyadevops/rideanalytics-dashboard:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          env:
            - name: API_BASE_URL
              value: http://rideanalytics-api:5000
---
apiVersion: v1
kind: Service
metadata:
  name: rideanalytics-dashboard
  namespace: rideanalytics
spec:
  selector:
    app: rideanalytics-dashboard
  ports:
    - port: 8501
      targetPort: 8501
